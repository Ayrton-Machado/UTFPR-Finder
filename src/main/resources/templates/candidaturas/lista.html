<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidaturas · UTFPR Finder</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments :: cabecalho}"></header><main class="container"><div class="perfil-cabecalho"><span class="perfil-icone"><svg class="icone"><use href="/icons.svg#send"></use></svg></span><div><h1 th:text="${gerencia} ? 'Candidaturas recebidas' : 'Minhas candidaturas'"></h1><p class="muted" th:text="${gerencia} ? 'Acompanhe os estudantes interessados nas oportunidades.' : 'Acompanhe o andamento das suas candidaturas.'"></p></div></div>
  <section class="lista-candidaturas"><article class="painel candidatura" th:each="c : ${candidaturas}"><div><span class="tag" th:text="${c.status}"></span><h2><a th:href="@{/oportunidades/{id}(id=${c.oportunidadeId})}" th:text="${c.oportunidade}"></a></h2><p th:if="${gerencia}"><strong th:text="${c.estudante}"></strong><span th:if="${c.curso != null and !c.curso.isBlank()}" th:text="' · ' + ${c.curso}"></span><span th:if="${c.campus != null and !c.campus.isBlank()}" th:text="' · ' + ${c.campus}"></span></p></div>
    <form th:if="${gerencia}" th:action="@{/candidaturas/{id}/status(id=${c.id})}" method="post" class="acao-status"><select name="status"><option>ENVIADA</option><option>EM_ANALISE</option><option>ACEITA</option><option>RECUSADA</option></select><button class="botao" type="submit">Atualizar</button></form></article></section>
  <div class="vazio" th:if="${candidaturas.empty}"><svg class="icone"><use href="/icons.svg#send"></use></svg><h2>Nenhuma candidatura</h2><p>As candidaturas aparecerão aqui.</p></div>
</main></body></html>
