<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova oportunidade · UTFPR Finder</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments :: cabecalho}"></header>
<main class="container estreito"><a class="voltar" th:href="@{/}">← Voltar</a><div class="perfil-cabecalho"><span class="perfil-icone"><svg class="icone"><use href="/icons.svg#briefcase"></use></svg></span><div><h1>Nova oportunidade</h1><p class="muted">Ela será vinculada a um campus e passará pela curadoria da universidade.</p></div></div>
  <div class="alerta erro" th:if="${erro}" th:text="${erro}"></div>
  <form th:action="@{/oportunidades}" method="post" class="formulario painel">
    <section class="form-secao"><h2>Informações principais</h2><div class="duas-colunas"><label>Título<input name="titulo" required maxlength="140" placeholder="Ex.: Estágio em desenvolvimento"></label><label>Responsável<input name="responsavel" required maxlength="120" placeholder="Empresa ou setor"></label></div><label>Descrição<textarea name="descricao" rows="6" required placeholder="Conte o que a pessoa fará e aprenderá."></textarea></label></section>
    <section class="form-secao"><h2>Contexto da oportunidade</h2><div class="tres-colunas"><label>Tipo<select name="tipo"><option>ESTAGIO</option><option>EMPREGO</option><option>PROJETO</option><option>EVENTO</option><option>DESAFIO</option><option>CAPACITACAO</option></select></label><label>Modalidade<select name="modalidade"><option>PRESENCIAL</option><option>HIBRIDO</option><option>REMOTO</option></select></label><label>Campus destinado<select name="campus" required><option value="">Selecione</option><option th:each="c : ${campi}" th:value="${c}" th:text="${c}"></option></select></label></div><div class="duas-colunas"><label>Localidade<input name="localidade" maxlength="120" placeholder="Endereço ou cidade, se necessário"></label><label>Prazo<input name="prazo" type="date"></label></div></section>
    <section class="form-secao"><h2>Perfil buscado</h2><div class="duas-colunas"><label>Curso desejado<input name="curso" maxlength="120" placeholder="Opcional"></label><label>Competências<input name="competencias" placeholder="java, comunicação, sql"><small>Separe por vírgulas.</small></label></div></section>
    <section class="form-secao"><label>Próximo passo<select name="status"><option value="PENDENTE">Enviar para aprovação</option><option value="RASCUNHO">Salvar como rascunho</option></select></label><button class="botao primario" type="submit"><svg class="icone"><use href="/icons.svg#send"></use></svg>Salvar oportunidade</button></section>
  </form>
</main></body></html>
