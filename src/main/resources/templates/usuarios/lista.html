<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pessoas · UTFPR Finder</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments :: cabecalho}"></header><main class="container"><div class="titulo-acao"><div><p class="eyebrow">Acessos</p><h1>Pessoas e organizações</h1><p class="muted">Estudantes, empresas, professores e administradores da plataforma.</p></div><a class="botao primario" th:href="@{/usuarios/novo}"><svg class="icone"><use href="/icons.svg#plus"></use></svg>Novo usuário</a></div><div class="alerta sucesso" th:if="${param.criado}">Usuário criado.</div>
  <div class="tabela"><div class="linha cabecalho"><span>Nome</span><span>Login</span><span>Papel</span></div><div class="linha" th:each="u : ${usuarios}"><strong th:text="${u.nome}"></strong><span th:text="${u.login}"></span><span class="tag" th:text="${u.papel}"></span></div></div>
</main></body></html>
