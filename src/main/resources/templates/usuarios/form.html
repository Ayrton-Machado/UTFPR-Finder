<!doctype html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Novo usuário · UTFPR Finder</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><header th:replace="~{fragments :: cabecalho}"></header><main class="container estreito"><a class="voltar" th:href="@{/usuarios}">← Voltar</a><div class="perfil-cabecalho"><span class="perfil-icone"><svg class="icone"><use href="/icons.svg#user"></use></svg></span><div><h1>Novo usuário</h1><p class="muted">Crie um acesso simples com o papel adequado.</p></div></div><div class="alerta erro" th:if="${erro}" th:text="${erro}"></div>
  <form th:action="@{/usuarios}" method="post" class="formulario painel"><label>Nome<input name="nome" th:value="${nome}" required maxlength="120"></label><label>Login<input name="login" th:value="${login}" required maxlength="80"></label><label>Senha inicial<input name="senha" type="password" required autocomplete="new-password"></label><label>Papel<select name="papel"><option value="ESTUDANTE">Estudante</option><option value="EMPRESA">Empresa</option><option value="PROFESSOR">Professor</option><option value="ADMIN">Administrador</option></select></label><button class="botao primario" type="submit"><svg class="icone"><use href="/icons.svg#plus"></use></svg>Criar usuário</button></form>
</main></body></html>
