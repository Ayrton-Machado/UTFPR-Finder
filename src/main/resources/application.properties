spring.application.name=utfpr-finder
spring.config.import=optional:file:.env[.properties]
server.port=${APP_PORT:8070}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:3300}/${POSTGRES_DB:utfpr_finder}
spring.datasource.username=${APP_DB_USER:finder_runtime}
spring.datasource.password=${APP_DB_PASSWORD:}
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${POSTGRES_USER:utfpr_finder}
spring.flyway.password=${POSTGRES_PASSWORD:}
spring.flyway.clean-disabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.enabled=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ssXXX} %-5level [%X{usuario_id:-}/%X{organizacao_id:-}] %logger{36} - %msg%n
